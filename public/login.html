<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ModeMuse</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;background:var(--cream);margin:0;font-family:'DM Sans',sans-serif}main{background:white;padding:38px;width:min(90%,380px);box-sizing:border-box}input,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box}input{border:1px solid #ddd}button{background:#171717;color:white;border:0;cursor:pointer}p{font-size:14px;color:#777}</style></head><body><main><a href="/" class="serif" style="font-size:28px;color:#171717;text-decoration:none">ModeMuse.</a><h1>Welcome back</h1><p id="help">Sign in with an email one-time code. No password needed.</p><form id="f"><input id="email" type="email" required autocomplete="username webauthn" placeholder="Email address"><input id="code" hidden inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"><button id="btn">Send sign-in code</button></form><p id="msg" role="status"></p></main><script>(function(){const A=window.hatchable.auth, e=document.getElementById('email'),c=document.getElementById('code'),b=document.getElementById('btn'),m=document.getElementById('msg'),f=document.getElementById('f');let step=0;const next=new URLSearchParams(location.search).get('next')||'/';function finish(){location.replace(next.startsWith('/')&&!next.startsWith('//')?next:'/')}A.getSession().then(s=>{if(s&&s.user)finish()});f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;try{if(!step){await A.startLogin({email:e.value.trim()});step=1;c.hidden=false;e.readOnly=true;b.textContent='Verify code';document.getElementById('help').textContent='Check your email and enter the one-time code.';m.textContent='Code sent.';c.focus()}else{await A.verifyCode({email:e.value.trim(),code:c.value.trim()});finish()}}catch(err){m.textContent=err.message||'Unable to sign in. Try again.'}finally{b.disabled=false}};})();</script></body></html>
