<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModeMuse — Store Admin</title><link rel="stylesheet" href="/theme.css"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script></head><body class="bg-[var(--cream)]" x-data="admin()"><header class="bg-black text-white px-6 py-5 flex justify-between"><a href="/" class="serif text-2xl">ModeMuse.</a><span class="text-xs tracking-widest self-center">STORE ADMIN</span></header><main class="max-w-6xl mx-auto px-5 py-10"><h1 class="text-4xl mb-2">Store dashboard</h1><p class="text-gray-600 mb-8">Manage product listings and customer orders. Admin APIs require Hatchable project admin access.</p><div class="grid md:grid-cols-2 gap-8"><section class="bg-white p-6"><h2 class="text-2xl mb-5">Add a product</h2><form @submit.prevent="add()" class="space-y-3"><input x-model="form.name" required placeholder="Product name" class="w-full border p-3"><select x-model="form.category" class="w-full border p-3"><option>Women</option><option>Men</option><option>Accessories</option></select><input x-model.number="form.price" type="number" min="1" required placeholder="Price in Naira" class="w-full border p-3"><input x-model="form.image_url" type="url" required placeholder="Image URL (https://...)" class="w-full border p-3"><input x-model="form.tag" placeholder="Badge e.g. NEW" class="w-full border p-3"><button class="bg-black text-white px-6 py-3 w-full">Save product</button></form><p x-text="message" class="text-sm mt-3"></p></section><section class="bg-white p-6"><div class="flex justify-between mb-5"><h2 class="text-2xl">Orders</h2><button @click="loadOrders()" class="text-sm underline">Refresh</button></div><template x-if="!orders.length"><p class="text-gray-500">No orders loaded yet.</p></template><template x-for="o in orders" :key="o.id"><div class="border-b py-4"><div class="flex justify-between"><strong x-text="'Order #'+o.id"></strong><span x-text="'₦'+Number(o.total).toLocaleString()"></span></div><p class="text-xs text-gray-500 mt-1" x-text="o.customer_email+' · '+o.payment_status"></p><p class="text-sm mt-2" x-text="o.shipping_address"></p><select :value="o.status" @change="status(o,$event.target.value)" class="border p-2 mt-2 text-sm"><option>pending</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></div></template></section></div><section class="bg-white p-6 mt-8"><h2 class="text-2xl mb-4">Products</h2><button @click="loadProducts()" class="underline text-sm mb-3">Refresh listings</button><template x-for="p in products" :key="p.id"><div class="flex justify-between items-center border-b py-3"><span x-text="p.name+' · ₦'+Number(p.price).toLocaleString()"></span><button @click="remove(p)" class="text-red-700 text-sm">Remove</button></div></template></section></main><script src="/admin.js"></script></body></html>
